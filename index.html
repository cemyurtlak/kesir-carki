<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kesir Çarkı">
<link rel="icon" href="ikon.png">
<link rel="apple-touch-icon" href="ikon.png">
<link rel="manifest" href="manifest.json">
<title>Kesir Çarkı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Yerleşim: tam ekran 3B sahne; üstte puan şeridi, ortada çark, altta ÇEVİR düğmesi.
   Soru gelince ortada soru kartı, dört köşede A-B-C-D şıkları (dikey ekranda kartın altında 2x2). */
:root{
  --gece:#0c0a2a;        /* zemin */
  --gece2:#22105c;       /* zemin parıltısı */
  --yazi:#fff8ea;        /* ana yazı */
  --soluk:#bdb6ee;       /* ikincil yazı */
  --altin:#ffc83d;       /* vurgu / puan */
  --altin2:#ff9f1c;
  --koyu:#1b0b3a;        /* parlak zemin üstü yazı */
  --cam:rgba(255,255,255,.08);
  --cam-cizgi:rgba(255,255,255,.16);
  --kart:rgba(24,16,72,.88);
  --ok:#3ee07a;
  --hata:#ff4d5e;
  --sa:#ff4f8b; --sb:#2fd0ff; --sc:#ffc83d; --sd:#47e08a;   /* şık renkleri */
  --f-baslik:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-govde:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 42%,var(--gece2),var(--gece) 72%);background-color:var(--gece);color:var(--yazi);font-family:var(--f-govde);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--altin);outline-offset:3px}
#sahne{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#konfeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* ---------- Üst şerit ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.logo{font-family:var(--f-baslik);font-weight:800;font-size:clamp(1.4rem,2.6vw,2.2rem);line-height:1;letter-spacing:.01em;text-shadow:0 0 18px rgba(255,200,61,.45)}
.logo b{color:var(--altin);font-weight:800}
.skorlar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--cam);border:1px solid var(--cam-cizgi);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk);font-weight:800}
.chip .deger{font-family:var(--f-baslik);font-size:1.35rem;line-height:1}
.chip.puan .deger{color:var(--altin);font-size:1.6rem}
.chip.seri .deger{color:#ff8a3d}
.chip.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.araclar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seviye{display:flex;background:var(--cam);border:1px solid var(--cam-cizgi);border-radius:999px;padding:3px}
.seviye button{padding:7px 14px;border-radius:999px;font-weight:800;font-size:.92rem;color:var(--soluk)}
.seviye button[aria-pressed="true"]{background:var(--altin);color:var(--koyu)}
.ikon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cam);border:1px solid var(--cam-cizgi);position:relative}
.ikon svg{width:22px;height:22px}
.ikon[aria-pressed="false"]{opacity:.5}
.ikon[aria-pressed="false"]::after{content:"";position:absolute;width:26px;height:3px;background:var(--hata);border-radius:2px;transform:rotate(-45deg)}

/* ---------- Çevir düğmesi ---------- */
.alt{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:opacity .3s,transform .3s}
.alt.gizli{opacity:0;transform:translateY(40px)}
.alt.gizli .cevir{pointer-events:none}
.cevir{pointer-events:auto;font-family:var(--f-baslik);font-weight:800;font-size:clamp(1.7rem,3.4vw,2.6rem);letter-spacing:.06em;line-height:1;padding:.42em 1.9em .32em;border-radius:999px;
  background:linear-gradient(180deg,#ffe07a,var(--altin) 45%,var(--altin2));color:var(--koyu);box-shadow:0 8px 0 #b35a00,0 0 46px rgba(255,200,61,.55);animation:nabiz 1.6s ease-in-out infinite;transition:transform .08s}
.cevir:active{transform:translateY(5px);box-shadow:0 3px 0 #b35a00,0 0 30px rgba(255,200,61,.5)}
@keyframes nabiz{50%{box-shadow:0 8px 0 #b35a00,0 0 80px rgba(255,200,61,.9)}}
.ipucu{font-size:.9rem;color:var(--soluk);font-weight:600}

/* ---------- Soru katmanı ---------- */
#soruKatman{position:fixed;inset:0;z-index:15;display:flex;background:radial-gradient(circle at 50% 50%,rgba(20,12,62,.55),rgba(6,4,22,.86));overflow:auto;
  padding-top:calc(78px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:sol .35s}
@keyframes sol{from{opacity:0}}
.izgara{flex:1;display:grid;width:100%;max-width:1560px;margin:0 auto;gap:clamp(12px,2vw,28px);
  grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:1fr 1fr;grid-template-areas:"a q b" "c q d"}
.sik{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:clamp(120px,22vh,220px);padding:18px 18px 18px 72px;border-radius:30px;
  color:var(--koyu);font-family:var(--f-baslik);font-weight:800;font-size:clamp(1.8rem,3.6vw,3.2rem);line-height:1;
  background:linear-gradient(155deg,#fff6 0%,transparent 40%),var(--renk);box-shadow:0 10px 0 rgba(0,0,0,.28),0 0 34px color-mix(in srgb,var(--renk) 55%,transparent);
  animation:gir .7s cubic-bezier(.2,1.4,.4,1) backwards;transition:transform .15s,opacity .3s,filter .3s}
.sik:hover:not(:disabled){transform:translateY(-4px) scale(1.02)}
.sik:active:not(:disabled){transform:translateY(4px) scale(.98)}
.sik:disabled{cursor:default}
.sik .harf{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--yazi);color:var(--koyu);font-size:1.6rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.sik[data-k="a"]{grid-area:a;align-self:start;--renk:var(--sa);--fx:-55vw;--fy:-35vh;animation-delay:.05s}
.sik[data-k="b"]{grid-area:b;align-self:start;--renk:var(--sb);--fx:55vw;--fy:-35vh;animation-delay:.15s}
.sik[data-k="c"]{grid-area:c;align-self:end;--renk:var(--sc);--fx:-55vw;--fy:35vh;animation-delay:.25s}
.sik[data-k="d"]{grid-area:d;align-self:end;--renk:var(--sd);--fx:55vw;--fy:35vh;animation-delay:.35s}
@keyframes gir{from{transform:translate(var(--fx),var(--fy)) rotate(-25deg) scale(.3);opacity:0}}
.sik.dogru{transform:scale(1.07);box-shadow:0 0 0 6px var(--ok),0 0 70px var(--ok);z-index:2}
.sik.dogru::after{content:"✓";position:absolute;right:-12px;top:-14px;width:52px;height:52px;border-radius:50%;background:var(--ok);color:var(--koyu);display:grid;place-items:center;font-size:2rem;animation:pop .5s}
.sik.yanlis{filter:grayscale(.8) brightness(.7);box-shadow:0 0 0 6px var(--hata);animation:salla .5s}
.sik.soluk{opacity:.32;filter:grayscale(.6)}
@keyframes salla{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}

.soru-kart{grid-area:q;align-self:center;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:clamp(18px,3vw,36px);border-radius:32px;
  background:var(--kart);border:3px solid var(--kat,var(--altin));box-shadow:0 0 0 8px color-mix(in srgb,var(--kat,var(--altin)) 22%,transparent),0 0 80px color-mix(in srgb,var(--kat,var(--altin)) 45%,transparent);animation:kartgel .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes kartgel{from{transform:scale(.4) rotate(6deg);opacity:0}}
.soru-kart.sars{animation:salla .45s}
.rozet{font-family:var(--f-baslik);font-weight:800;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 16px;border-radius:999px;background:var(--kat,var(--altin));color:var(--koyu)}
.soru-metin{font-size:clamp(1.25rem,2.3vw,1.9rem);font-weight:800;line-height:1.35;text-wrap:balance;max-width:34ch}
.islem{font-family:var(--f-baslik);font-size:clamp(2.2rem,5vw,4.4rem);font-weight:800;line-height:1.1;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:.25em;flex-wrap:wrap}
.sure{width:100%;height:12px;border-radius:999px;background:var(--cam);overflow:hidden}
.sure i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--altin),var(--hata));transform-origin:left;border-radius:inherit}
.geri{font-family:var(--f-baslik);font-weight:800;font-size:clamp(2rem,4vw,3.2rem);line-height:1;animation:pop .5s}
.geri.iyi{color:var(--ok);text-shadow:0 0 24px rgba(62,224,122,.6)}
.geri.kotu{color:#ff7a86}
.aciklama{font-size:clamp(1rem,1.6vw,1.25rem);line-height:1.5;color:var(--soluk);background:var(--cam);border:1px solid var(--cam-cizgi);border-radius:18px;padding:14px 18px;max-width:46ch;text-wrap:pretty}
.aciklama .adim{font-family:var(--f-baslik);font-size:clamp(1.4rem,2.6vw,2.1rem);color:var(--yazi);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:.25em;flex-wrap:wrap;line-height:1.15}
.devam{font-family:var(--f-baslik);font-weight:800;font-size:1.5rem;padding:.4em 1.6em .3em;border-radius:999px;background:linear-gradient(180deg,#ffe07a,var(--altin2));color:var(--koyu);box-shadow:0 6px 0 #b35a00}
.devam:active{transform:translateY(4px);box-shadow:0 2px 0 #b35a00}

/* Kesir gösterimi */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .08em;font-variant-numeric:tabular-nums}
.frac>span{padding:0 .18em;min-width:.8em;text-align:center}
.frac>span:first-child{border-bottom:.075em solid currentColor;padding-bottom:.08em}
.frac>span:last-child{padding-top:.08em}
.karisik{display:inline-flex;align-items:center;gap:.04em}
.kutu{display:inline-block;min-width:1em;padding:0 .1em;border:.07em dashed currentColor;border-radius:.15em;line-height:1}
.sik .frac{font-size:.92em}

/* Kutlama yazısı */
#kutlama{position:fixed;left:0;right:0;top:40%;z-index:40;text-align:center;pointer-events:none;font-family:var(--f-baslik);font-weight:800;font-size:clamp(3rem,9vw,8rem);line-height:1;
  color:var(--altin);text-shadow:0 6px 0 #b35a00,0 0 50px rgba(255,200,61,.8);padding-inline:16px}
#kutlama.goster{animation:kutla 1.8s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes kutla{0%{transform:scale(.2) rotate(-12deg);opacity:0}20%{transform:scale(1.1) rotate(3deg);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}

#uyari{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;font-size:1.3rem;background:var(--gece)}

/* El ile oynama */
.el-btn{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 12px;border-radius:999px;background:var(--cam);border:1px solid var(--cam-cizgi);font-weight:800;font-size:.95rem}
.el-btn svg{width:24px;height:24px}
.el-btn[aria-pressed="true"]{background:var(--altin);color:var(--koyu);border-color:var(--altin);box-shadow:0 0 22px rgba(255,200,61,.5)}
.el-btn:disabled{opacity:.6;cursor:wait}
#elPanel{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:clamp(150px,16vw,240px);border-radius:18px;overflow:hidden;border:2px solid var(--cam-cizgi);background:var(--kart);box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .3s}
#elPanel.sakla{opacity:0;pointer-events:none}
#elOnizleme{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#000}
#elDurum{font-size:.85rem;font-weight:800;padding:6px 10px;color:var(--soluk);text-align:center}
.el-imlec{position:fixed;left:0;top:0;z-index:35;width:76px;height:76px;margin:-38px 0 0 -38px;pointer-events:none;opacity:0;transition:opacity .2s}
.el-imlec .nokta{position:absolute;inset:25px;border-radius:50%;background:var(--renk);box-shadow:0 0 20px var(--renk),inset 0 0 0 3px var(--yazi);transition:transform .15s}
.el-imlec svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.el-imlec circle{fill:none;stroke-width:7}
.el-imlec .iz{stroke:rgba(255,255,255,.22)}
.el-imlec .dolum{stroke:var(--renk);stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201}
#imlec0{--renk:var(--sb)} #imlec1{--renk:var(--sa)}
.el-imlec.hizli .nokta{transform:scale(1.9)}
.el-hedef{outline:6px solid var(--yazi)!important;outline-offset:5px}
#bilgi{box-sizing:border-box;position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:36;width:max-content;max-width:min(92vw,680px);text-align:center;font-weight:800;font-size:clamp(1rem,1.6vw,1.25rem);line-height:1.35;padding:10px 22px;border-radius:24px;background:var(--kart);border:2px solid var(--altin);box-shadow:0 0 30px rgba(255,200,61,.35);pointer-events:none;animation:sol .3s}


/* Robot köpek */
#sahne{touch-action:none}
#kopekUI{position:fixed;left:0;right:0;bottom:0;z-index:18;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:sol .4s}
#kopekUI>*{pointer-events:auto}
.kopek-durum{font-family:var(--f-baslik);font-weight:800;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.15;text-align:center;padding:10px 26px 8px;border-radius:24px;background:var(--kart);border:2px solid var(--kopek,#6ff3ff);box-shadow:0 0 30px color-mix(in srgb,var(--kopek,#6ff3ff) 40%,transparent);max-width:min(92vw,720px);transition:border-color .4s,box-shadow .4s}
.kopek-durum.zipla{animation:pop .5s}
.mutluluk{display:flex;align-items:center;gap:12px;width:min(92vw,560px);padding:8px 16px;border-radius:999px;background:var(--cam);border:1px solid var(--cam-cizgi);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mutluluk .m-kalp{font-size:1.9rem;line-height:1;color:#ff4f8b;text-shadow:0 0 16px #ff4f8b;display:inline-block}
.mutluluk.atiyor .m-kalp{animation:atis .5s infinite}
@keyframes atis{30%{transform:scale(1.35)}}
.m-bar{flex:1;height:20px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.m-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#6ff3ff,#a35bff 50%,#ff4f8b);box-shadow:0 0 16px rgba(255,79,139,.6);transition:width .25s}
.mutluluk b{font-family:var(--f-baslik);font-size:1.4rem;min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.kopek-alt{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.kopek-alt .devam{font-size:1.25rem}

/* Dikey ekran (tablet dik, telefon) */
@media (max-aspect-ratio:1/1),(max-width:760px){
  .izgara{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"q q" "a b" "c d";align-content:center}
  .sik{min-height:clamp(84px,13vh,150px);align-self:stretch!important;font-size:clamp(1.5rem,5.5vw,2.6rem);padding-left:64px}
  .sik .harf{width:40px;height:40px;font-size:1.3rem;left:12px}
  .soru-kart{align-self:stretch}
}
@media (max-width:560px){ .logo{display:none} .seviye button{padding:6px 10px} .chip{padding:5px 10px} }
/* Telefon: üst şerit iki satıra sığsın (Aşama 5) */
@media (max-width:560px){
  .hud{gap:6px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:6px;justify-content:center}
  .skorlar{gap:6px;justify-content:center}
  .chip{padding:4px 10px}.chip .deger{font-size:1.1rem}.chip.puan .deger{font-size:1.3rem}.chip small{font-size:.62rem}
  .araclar{gap:5px;justify-content:center}
  .seviye button{padding:5px 8px;font-size:.82rem}
  .ikon{width:36px;height:36px}.ikon svg{width:18px;height:18px}
  .el-btn{height:36px;width:36px;padding:0;justify-content:center;font-size:0;gap:0}
  .el-btn svg{width:20px;height:20px}
  #ekranBtn{display:none}
  .cevir{font-size:1.6rem}
  .ipucu{font-size:.8rem;text-align:center}
}
@media (prefers-reduced-motion:reduce){ .cevir{animation:none} .sik,.soru-kart{animation-duration:.01s} }
</style>
</head>
<body>


<canvas id="sahne" aria-label="Kesir çarkı. Döndürmek için dokunun."></canvas>
<canvas id="konfeti"></canvas>

<header class="hud">
  <div class="logo">Kesir <b>Çarkı</b></div>
  <div class="skorlar" aria-live="polite">
    <div class="chip puan"><small>Puan</small><span class="deger" id="puan">0</span></div>
    <div class="chip seri"><small>Seri</small><span class="deger" id="seri">0</span></div>
    <div class="chip"><small>Doğru</small><span class="deger" id="dogruS">0</span><small>/</small><span class="deger" id="toplamS">0</span></div>
  </div>
  <div class="araclar">
    <div class="seviye" role="group" aria-label="Zorluk">
      <button type="button" data-s="1" aria-pressed="false">Kolay</button>
      <button type="button" data-s="2" aria-pressed="true">Orta</button>
      <button type="button" data-s="3" aria-pressed="false">Zor</button>
    </div>
    <button type="button" class="el-btn" id="elBtn" aria-pressed="false" title="Kamerayla elini kullanarak oyna" aria-label="El ile oyna">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-4.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.8-2.4L3.5 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>El ile oyna</button>
    <button type="button" class="el-btn" id="kopekBtn" aria-pressed="false" title="Robot köpek Robo'yu sev" aria-label="Robot Köpek">

<script>
"use strict";
// <SORULAR> ================= KESİR MATEMATİĞİ VE SORU ÜRETİCİ =================
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const K=(n,d)=>d<0?{n:-n,d:-d}:{n,d};
const sade=f=>{const g=gcd(f.n,f.d);return K(f.n/g,f.d/g)};
const deger=f=>f.n/f.d;
const anahtar=f=>{const s=sade(f);return s.n+'/'+s.d};
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const sec=a=>a[Math.floor(Math.random()*a.length)];
const karistir=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const topla=(a,b)=>sade(K(a.n*b.d+b.n*a.d,a.d*b.d));
const cikar=(a,b)=>sade(K(a.n*b.d-b.n*a.d,a.d*b.d));
const carp=(a,b)=>sade(K(a.n*b.n,a.d*b.d));
const bol=(a,b)=>sade(K(a.n*b.d,a.d*b.n));
const basitKesir=(dmin,dmax)=>{let d,n;do{d=r(dmin,dmax);n=r(1,d-1)}while(gcd(n,d)!==1);return K(n,d)};

// HTML gösterimi
const frac=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
function kH(f,o={}){
  if(f.d===1) return `<span>${f.n}</span>`;
  if(o.karisik&&f.n>f.d){const t=Math.floor(f.n/f.d),k=f.n%f.d;if(k===0)return `<span>${t}</span>`;return `<span class="karisik"><span>${t}</span>${frac(k,f.d)}</span>`}
  return frac(f.n,f.d);
}
const karisikH=(a,b,c)=>`<span class="karisik"><span>${a}</span>${frac(b,c)}</span>`;

function uygun(f){return !!f&&Number.isInteger(f.n)&&Number.isInteger(f.d)&&f.d>0&&f.n>0&&f.d<=400&&f.n<=2000}
// dogru + yanlış adaylar -> 4 benzersiz şık. ham=true: aynı değerli farklı yazımlar ayrı sayılır.
function secenekKur(dogru,yanlislar,dolgu,ham=false){
  const anah=f=>ham?f.n+'/'+f.d:anahtar(f);
  const dv=deger(dogru),liste=[{f:dogru,dogru:true}],goru=new Set([anah(dogru)]);
  const ekle=(c,izin)=>{if(liste.length>=4||!uygun(c))return;const k=anah(c);if(goru.has(k))return;if(!izin&&Math.abs(deger(c)-dv)<1e-9)return;goru.add(k);liste.push({f:c})};
  for(const y of yanlislar){if(y&&y.izin)ekle(y.f,true);else ekle(y,false)}
  let g=0;while(liste.length<4&&g++<500)ekle(dolgu(),false);
  return karistir(liste);
}
const yakin=f=>()=>{const s=sade(f);if(s.d===1)return K(s.n+sec([-3,-2,-1,1,2,3,4,5,10]),1);return K(s.n+sec([1,-1,2,-2,0,3]),s.d+sec([0,0,1,-1,2,-2]))};
const yakinTam=x=>()=>K(x+sec([-10,-5,-3,-2,-1,1,2,3,4,5,10]),1);

function addAciklama(a,b,op){
  const L=lcm(a.d,b.d),x=a.n*L/a.d,y=b.n*L/b.d,z=op==='+'?x+y:x-y,son=sade(K(z,L)),s=op==='+'?'+':'−';
  let t=a.d===b.d?`Paydalar eşit. Payları ${op==='+'?'toplar':'çıkarır'}, paydayı aynen yazarız:`:`Önce paydaları eşitleriz (ortak payda ${L}):`;
  t+=`<div class="adim">${kH(a)} ${s} ${kH(b)} = ${a.d===b.d?'':`${frac(x,L)} ${s} ${frac(y,L)} = `}${frac(z,L)}${(son.n!==z||son.d!==L)?` = ${kH(son)}`:''}</div>`;
  if(son.n!==z||son.d!==L)t+=`<div style="margin-top:6px">Sonucu sadeleştirmeyi unutma!</div>`;
  return t;
}

const URETICI={
  topla(L){
    let a,b;
    if(L===1){const d=r(4,12),n1=r(1,d-2),n2=r(1,d-1-n1);a=K(n1,d);b=K(n2,d)}
    else if(L===2){const d1=r(2,6),d2=d1*r(2,3);a=K(r(1,d1-1),d1);b=K(r(1,d2-1),d2);if(Math.random()<.5)[a,b]=[b,a]}
    else{let d1,d2;do{d1=r(2,9);d2=r(2,9)}while(d1===d2||d1%d2===0||d2%d1===0);a=basitKesir(d1,d1);b=basitKesir(d2,d2)}
    const c=topla(a,b);
    return{soru:`İşlemin sonucu kaçtır?<div class="islem">${kH(a)} + ${kH(b)} = ?</div>`,
      secenekler:secenekKur(c,[K(a.n+b.n,a.d+b.d),K(a.n+b.n,a.d*b.d),K(a.n*b.d+b.n*a.d,a.d+b.d),K(a.n*b.n,a.d*b.d)],yakin(c)),aciklama:addAciklama(a,b,'+')};
  },
  cikar(L){
    let a,b;
    if(L===1){const d=r(4,12),n1=r(2,d-1),n2=r(1,n1-1);a=K(n1,d);b=K(n2,d)}
    else{do{if(L===2){const d1=r(2,6),d2=d1*r(2,3);a=K(r(1,d1-1),d1);b=K(r(1,d2-1),d2)}else{let d1,d2;do{d1=r(2,9);d2=r(2,9)}while(d1===d2||d1%d2===0||d2%d1===0);a=basitKesir(d1,d1);b=basitKesir(d2,d2)}
      if(deger(a)<deger(b))[a,b]=[b,a]}while(Math.abs(deger(a)-deger(b))<1e-9)}
    const c=cikar(a,b);
    return{soru:`İşlemin sonucu kaçtır?<div class="islem">${kH(a)} − ${kH(b)} = ?</div>`,
      secenekler:secenekKur(c,[K(a.n-b.n,a.d-b.d),K(a.n-b.n,a.d+b.d),topla(a,b),K(a.n-b.n,a.d*b.d)],yakin(c)),aciklama:addAciklama(a,b,'-')};
  },
  carp(L){
    let a,b;
    if(L===1){a=basitKesir(2,6);b=basitKesir(2,6)}
    else if(L===2){a=basitKesir(2,9);b=basitKesir(2,9)}
    else if(Math.random()<.5){a=K(r(2,9),1);b=basitKesir(3,12)}
    else{const p=r(1,5),q=r(2,6),k=r(2,4);a=sade(K(p,q*k));b=sade(K(k*r(1,3),r(p+1,9)));if(!uygun(a)||!uygun(b)){a=basitKesir(3,9);b=basitKesir(3,9)}}
    const c=carp(a,b),son=c,ham=K(a.n*b.n,a.d*b.d);
    let t=a.d===1?`Tam sayıyı paydası 1 olan bir kesir gibi düşün. `:'';
    t+=`Pay ile pay, payda ile payda çarpılır:<div class="adim">${kH(a)} × ${kH(b)} = ${frac(`${a.n} × ${b.n}`,`${a.d} × ${b.d}`)} = ${kH(ham)}${(son.n!==ham.n||son.d!==ham.d)?` = ${kH(son)}`:''}</div>`;
    return{soru:`İşlemin sonucu kaçtır?<div class="islem">${kH(a)} × ${kH(b)} = ?</div>`,
      secenekler:secenekKur(c,[K(a.n*b.d,a.d*b.n),K(a.n*b.n,a.d+b.d),K(a.n+b.n,a.d*b.d),K(a.n*b.n,a.d)],yakin(c)),aciklama:t};
  },
  bol(L){
    let a,b;
    if(L===1){a=basitKesir(2,6);b=basitKesir(2,6)}
    else if(L===2){a=basitKesir(2,9);b=basitKesir(2,9)}
    else if(Math.random()<.5){a=K(r(2,9),1);b=basitKesir(2,9)}
    else{a=basitKesir(2,9);b=K(r(2,6),1)}
    const c=bol(a,b),ters=K(b.d,b.n),ham=K(a.n*b.d,a.d*b.n);
    const t=`Birinci kesir aynen yazılır, ikinci kesir ters çevrilip çarpılır:<div class="adim">${kH(a)} ÷ ${kH(b)} = ${kH(a)} × ${frac(ters.n,ters.d)} = ${kH(ham)}${(c.n!==ham.n||c.d!==ham.d)?` = ${kH(c)}`:''}</div>`;
    return{soru:`İşlemin sonucu kaçtır?<div class="islem">${kH(a)} ÷ ${kH(b)} = ?</div>`,
      secenekler:secenekKur(c,[K(a.n*b.n,a.d*b.d),K(a.d*b.n,a.n*b.d),K(a.n*b.d,a.d+b.n),K(a.n*b.n,a.d*b.d*2)],yakin(c)),aciklama:t};
  },
  sade(L){
    const s=basitKesir(2,L===1?6:9),p=s.n,q=s.d;
    const k=L===1?r(2,4):L===2?r(2,6):sec([4,6,8,9,10,12]);
    if(L===1||Math.random()<.6){
      const ust=K(p*k,q*k),yan=[];
      for(let g=2;g<k;g++)if(k%g===0){yan.push({izin:true,f:K(p*k/g,q*k/g)});break}
      yan.push(K(q,p),K(p+1,q),K(p,q+1),K(p*k-k,q*k));
      return{soru:`Bu kesrin <b>en sade</b> hâli hangisidir?<div class="islem">${kH(ust)}</div>`,ham:true,
        secenekler:secenekKur(s,yan,()=>K(p+sec([1,2,-1,0]),q+sec([1,-1,2,0])),true),
        aciklama:`Pay ve paydayı en büyük ortak bölenleri olan ${k} sayısına böleriz:<div class="adim">${kH(ust)} = ${frac(`${p*k} ÷ ${k}`,`${q*k} ÷ ${k}`)} = ${kH(s)}</div>`};
    }
    const x=p*k;
    return{soru:`Kutudaki sayı kaç olmalı?<div class="islem">${kH(s)} = ${frac('<span class="kutu">?</span>',q*k)}</div>`,
      secenekler:secenekKur(K(x,1),[K(p+k,1),K(q*k-p,1),K(x+p,1),K(k,1)],yakinTam(x)),
      aciklama:`Payda ${q} iken ${q*k} oldu, yani ${k} ile çarpıldı. Payı da ${k} ile çarparız:<div class="adim">${p} × ${k} = ${x}</div>`};
  },
  kiyas(L){
    const buyuk=Math.random()<.5;let fs,kural='';
    const farkli=arr=>new Set(arr.map(anahtar)).size===arr.length;
    if(L===1){
      if(Math.random()<.5){const d=r(7,12);do{fs=[0,0,0,0].map(()=>K(r(1,d-1),d))}while(!farkli(fs));kural='Paydalar eşitse payı büyük olan kesir daha büyüktür.'}
      else{const n=r(1,4);do{fs=[0,0,0,0].map(()=>K(n,r(n+1,12)))}while(!farkli(fs));kural='Paylar eşitse paydası küçük olan kesir daha büyüktür.'}
    }else{
      const ust=L===2?10:15;do{fs=[0,0,0,0].map(()=>K(r(1,ust-1),r(2,ust)));fs=fs.filter(f=>f.n<f.d)}while(fs.length<4||!farkli(fs));
      kural='Paydaları eşitleyerek ya da her kesri ondalık sayıya çevirerek karşılaştırabiliriz.';
    }
    const sirali=fs.slice().sort((x,y)=>deger(x)-deger(y)),hedef=buyuk?sirali[3]:sirali[0];
    return{soru:`Hangisi <b>en ${buyuk?'büyük':'küçük'}</b> kesirdir?`,
      secenekler:karistir(fs.map(f=>({f,dogru:f===hedef}))),
      aciklama:`${kural}<div class="adim">${sirali.map(f=>kH(f)).join(' < ')}</div>`};
  },
  kadar(L){
    const s=basitKesir(2,L===1?6:L===2?8:10),p=s.n,q=s.d;
    if(L<3||Math.random()<.4){
      const m=L===1?r(2,8):r(3,12),N=q*m,x=p*m,fh=kH(s);
      const sablon=sec([
        `${N} sayısının ${fh} kadarı kaçtır?`,
        `Bir sınıfta ${N} öğrenci var. Öğrencilerin ${fh} kadarı gözlüklü. Kaç öğrenci gözlüklü?`,
        `${N} sayfalık bir kitabın ${fh} kadarı okundu. Kaç sayfa okundu?`,
        `${N} TL harçlığın ${fh} kadarı harcandı. Kaç TL harcandı?`,
        `Bir kutuda ${N} bilye var. Bilyelerin ${fh} kadarı kırmızı. Kaç bilye kırmızı?`]);
      return{soru:sablon,secenekler:secenekKur(K(x,1),[K(m,1),K(N-x,1),K(x+m,1),K(N+p,1)],yakinTam(x)),
        aciklama:`Önce paydaya böleriz, sonra payla çarparız:<div class="adim">${N} ÷ ${q} = ${m}</div><div class="adim">${m} × ${p} = ${x}</div>`};
    }
    const m=r(2,12),X=p*m,T=q*m;
    return{soru:`Bir sayının ${kH(s)} kadarı ${X} ise bu sayının tamamı kaçtır?`,
      secenekler:secenekKur(K(T,1),[K(m,1),K(X*q,1),K(T-m,1),K(X+q,1)],yakinTam(T)),
      aciklama:`${X} sayısı ${p} parçaya karşılık gelir. Bir parça: <div class="adim">${X} ÷ ${p} = ${m}</div>Tamamı ${q} parça:<div class="adim">${m} × ${q} = ${T}</div>`};
  },
  tam(L){
    const a=r(1,L+2),c=r(2,L===1?6:9);let b;do{b=r(1,c-1)}while(gcd(b,c)!==1);
    const n=a*c+b;
    if(Math.random()<.5){
      return{soru:`Bu tam sayılı kesrin <b>bileşik kesir</b> hâli hangisidir?<div class="islem">${karisikH(a,b,c)}</div>`,ham:true,
        secenekler:secenekKur(K(n,c),[K(a*b+c,c),K(a+b,c),K(a*c-b,c),K(n,b),K(n,a*c)],()=>K(n+sec([-2,-1,1,2,c]),c+sec([0,0,1,-1])),true),
        aciklama:`Tam kısım ile payda çarpılır, pay eklenir. Payda aynı kalır:<div class="adim">${frac(`${a} × ${c} + ${b}`,c)} = ${frac(n,c)}</div>`};
    }
    const mx=(t,k)=>K(t*c+k,c),yan=[mx(a,c-b),mx(a+1,b),mx(b<c&&a<c?b:a+2,a<c?a:1)];if(a>1)yan.push(mx(a-1,b));
    return{soru:`Bu bileşik kesrin <b>tam sayılı kesir</b> hâli hangisidir?<div class="islem">${frac(n,c)}</div>`,karisik:true,
      secenekler:secenekKur(K(n,c),yan,()=>mx(Math.max(1,a+sec([-1,1,2,3,4])),r(1,c-1))),
      aciklama:`Payı paydaya böleriz. Bölüm tam kısım, kalan yeni pay olur:<div class="adim">${n} ÷ ${c} = ${a}, kalan ${b}</div><div class="adim">${frac(n,c)} = ${karisikH(a,b,c)}</div>`};
  }
};
function soruUret(id,L){const q=URETICI[id](L);q.karisik=!!q.karisik;return q}

// ================= SES (Web Audio ile üretilir, dosya gerekmez) =================
const Ses={ctx:null,acik:true,muzikAcik:false,_zam:null,_adim:0,
  baslat(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.ana=this.ctx.createGain();this.ana.gain.value=.7;this.ana.connect(this.ctx.destination);

const ibreAltindaki=rot=>{const a=((Math.PI/2-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.floor(a/DILIM)%SEG};

// secenek: {guc:0..1, yon:1 (saat yönü tersi) | -1 (saat yönü)} — el/kaydırma hızından gelir
function cevir(secenek){
  if(durum.asama!=='bos'||!cark)return;
  Ses.baslat();Ses.vuuu();
  const g=secenek&&typeof secenek.guc==='number'?secenek.guc:null,yon=secenek&&secenek.yon<0?-1:1;
  const tur=g===null?5+r(0,2):Math.round(3+g*9),sure=g===null?4800+Math.random()*900:3400+g*3800;
  let k;do{k=r(0,SEG-1)}while(k===durum.sonKat&&Math.random()<.7);
  const T=Math.PI*2,hedefMod=Math.PI/2-(k+.5)*DILIM+(Math.random()-.5)*DILIM*.6,bas=cark.rotation.z,taban=bas+yon*T*tur;
  const son=yon>0?hedefMod+T*Math.ceil((taban-hedefMod)/T):hedefMod-T*Math.ceil((hedefMod-taban)/T);
  Object.assign(donus,{aktif:true,bas,son,t0:performance.now(),sure,hedef:k,sonIndeks:ibreAltindaki(bas)});
  durum.asama='donuyor';el.alt.classList.add('gizli');
}

const TESELLI=['Az kaldı!','Olsun, öğreniyoruz!','Bir dahakine!','Neredeyse!'];
function cevapla(i){
  if(durum.asama!=='soru')return;durum.asama='cevaplandi';clearInterval(sureZam);
  const q=durum.soru,di=q.secenekler.findIndex(s=>s.dogru),dogru=i===di;
  el.siklar.forEach((b,j)=>{b.disabled=true;if(j===di)b.classList.add('dogru');else if(j===i)b.classList.add('yanlis');else b.classList.add('soluk')});
  durum.toplam++;

    durum.dogru++;durum.seri++;let kazanc=[0,10,15,20][durum.seviye];if(durum.seri>=3)kazanc+=5;
    if(durum.sureAcik)kazanc+=Math.max(0,Math.floor((durum.sureBit-performance.now())/4000));
    durum.puan+=kazanc;Ses.dogru();
    el.geri.className='geri iyi';el.geri.textContent=sec(OVGU)+'  +'+kazanc;
    const rc=el.siklar[di].getBoundingClientRect();konfeti(rc.left+rc.width/2,rc.top+rc.height/2,170);kutlamaBitis=performance.now()+2200;
    if([3,5,10,15,20].includes(durum.seri))setTimeout(()=>{Ses.seri();kutlamaYaz(durum.seri>=10?'EFSANE! '+durum.seri+' SERİ':durum.seri>=5?'MUHTEŞEM! '+durum.seri+' SERİ':'3 SERİ! SÜPER!');konfeti(innerWidth/2,innerHeight*.45,260)},500);
  }else{
    durum.seri=0;Ses.yanlis();
    el.geri.className='geri kotu';el.geri.textContent=(i<0?'Süre doldu! ':sec(TESELLI)+' ')+'Doğru cevap: '+'ABCD'[di];

}

function konfeti(x,y,adet){const o=konfCv.width/innerWidth;for(let i=0;i<adet;i++){const a=Math.random()*Math.PI*2,h=6+Math.random()*16;
  parcalar.push({x:x*o,y:y*o,vx:Math.cos(a)*h*o,vy:(Math.sin(a)*h-8)*o,g:.42*o,w:(7+Math.random()*9)*o,h:(4+Math.random()*7)*o,r:Math.random()*6,vr:(Math.random()-.5)*.4,renk:sec(KRENK),sekil:Math.random()<.3})}}

  if(p.y>konfCv.height+40){parcalar.splice(i,1);continue}kx.save();kx.translate(p.x,p.y);kx.rotate(p.r);kx.scale(1,Math.cos(p.r*2));kx.fillStyle=p.renk;
  if(p.sekil){kx.beginPath();kx.arc(0,0,p.w/2,0,7);kx.fill()}else kx.fillRect(-p.w/2,-p.h/2,p.w,p.h);kx.restore()}kalpCiz()}
// uçuşan kalpler (robot köpek okşanınca)
const kalpler=[],KALP_RENK=['#ff4f8b','#ff2d55','#ff7ab6','#ff5fd2','#ff9ec7'];
function kalpYol(x,cx,cy,s){x.beginPath();x.moveTo(cx,cy+s*.9);x.bezierCurveTo(cx-s*1.3,cy+s*.1,cx-s*.9,cy-s,cx,cy-s*.35);x.bezierCurveTo(cx+s*.9,cy-s,cx+s*1.3,cy+s*.1,cx,cy+s*.9);x.closePath()}
function kalp(x,y,adet,patla){const o=konfCv.width/innerWidth;for(let i=0;i<adet;i++){const a=patla?Math.random()*Math.PI*2:-Math.PI/2+(Math.random()-.5)*1.3,h=patla?4+Math.random()*10:2.6+Math.random()*2.6;
  kalpler.push({x:x*o,y:y*o,vx:Math.cos(a)*h*o,vy:Math.sin(a)*h*o,s:(13+Math.random()*17)*o*(patla?1.25:1),yas:0,omur:70+Math.random()*55,faz:Math.random()*6,renk:sec(KALP_RENK)})}}
function kalpCiz(){const o=konfCv.width/innerWidth;for(let i=kalpler.length-1;i>=0;i--){const p=kalpler[i];p.yas++;if(p.yas>p.omur){kalpler.splice(i,1);continue}
  p.vx*=.96;p.vy=p.vy*.965-.06*o;p.x+=p.vx+Math.sin(p.yas*.12+p.faz)*.9*o;p.y+=p.vy;
  const a=1-p.yas/p.omur,s=p.s*(p.yas<8?.5+p.yas/16:1);kx.save();kx.globalAlpha=Math.min(1,a*1.5);kx.translate(p.x,p.y);kx.rotate(Math.sin(p.yas*.1+p.faz)*.25);
  kalpYol(kx,0,0,s);kx.fillStyle=p.renk;kx.shadowColor=p.renk;kx.shadowBlur=10*o;kx.fill();kx.shadowBlur=0;kx.fillStyle='rgba(255,255,255,.6)';kx.beginPath();kx.ellipse(-s*.42,-s*.3,s*.17,s*.1,-.7,0,7);kx.fill();kx.restore()}}

function dongu(now){
  requestAnimationFrame(dongu);
  const t=now/1000;
  if(cark){
    if(donus.aktif){let p=Math.min(1,(now-donus.t0)/donus.sure);const e=1-Math.pow(1-p,4);cark.rotation.z=donus.bas+(donus.son-donus.bas)*e;
      const ix=ibreAltindaki(cark.rotation.z);if(ix!==donus.sonIndeks){donus.sonIndeks=ix;Ses.tik();isaretSalla=.55}
      if(p>=1){donus.aktif=false;donusBitti()}}
    else if(durum.asama==='bos'&&!Surukle.aktif)cark.rotation.z+=.0016;
    isaretSalla*=.86;isaret.rotation.z=isaretSalla*(donus.aktif||Surukle.aktif?1:0)+Math.sin(t*3)*.02;
    egik.position.y=.25+Math.sin(t*1.2)*.06;egik.rotation.y=Math.sin(t*.5)*.08;
    const kutla=now<kutlamaBitis,hiz=donus.aktif?14:kutla?20:4;
    ampuller.forEach((m,i)=>{const on=kutla?((Math.floor(t*10)+i)%2===0):(Math.sin(i*.8-t*hiz)>.2);m.material.emissiveIntensity=on?1.6:.15});
    const vz=(now-kazananVurgu)/1000;
    dilimler.forEach((m,i)=>{const kaz=i===durum.sonKat&&vz<2.2&&durum.asama!=='donuyor';m.material.emissiveIntensity=kaz?.35+Math.abs(Math.sin(vz*9))*.6:.18;m.position.z=kaz?Math.sin(Math.min(vz,1)*Math.PI)*.25:0});
    parlama.material.opacity=.55+Math.sin(t*2)*.15+(kutla?.3:0);parlama.material.rotation=t*.2;
    isiklar.forEach(p=>{p.position.set(Math.cos(t*.7+p.userData.faz)*7,Math.sin(t*.9+p.userData.faz)*4,5)});
    yildizlar.rotation.y=t*.02;yildizlar.rotation.x=Math.sin(t*.1)*.05;
    yuzenler.forEach(s=>{s.position.y+=s.userData.vy;s.position.x+=Math.sin(t+s.userData.faz)*.004;s.material.rotation=Math.sin(t*.6+s.userData.faz)*.3;if(s.position.y>11)s.position.y=-11});
    const hedefZ=durum.asama==='soru'||durum.asama==='cevaplandi'?kamZ*1.25:kamZ;camera.position.z+=(hedefZ-camera.position.z)*.06;
    if(Kopek.aktif){kopekGuncelle(now);renderer.render(Kopek.sahne,Kopek.kamera)}else renderer.render(scene,camera);
  }
  if(parcalar.length||kalpler.length)konfetiCiz();else if(konfetiDolu){kx.clearRect(0,0,konfCv.width,konfCv.height)}konfetiDolu=parcalar.length+kalpler.length>0;
}

function donusYonu(px,py,dx,dy){const rx=px-innerWidth/2,ry=py-innerHeight*.47,cz=-rx*dy+ry*dx;return Math.abs(cz)>1e-6?(cz>0?1:-1):(dx>0?-1:1)}

// Çark parmağı takip eder; bırakınca parmağın açısal hızıyla döner ve kendiliğinden yavaşlar.
// Durduğu dilim bu hareketten çıkar (önceden seçilmez). Dönüş eğrisi cevir() ile aynı: 1-(1-p)^4.
const SURUKLE_MIN_HIZ=6;     // rad/sn — bundan yavaş bırakılırsa çark dönmez, "Daha hızlı çevir!" der
const Surukle={aktif:false,id:null,m:null,aci:0,ornek:[],toplam:0};
let _cv1=null,_cv2=null;
function carkEkran(){
  if(!_cv1){_cv1=new THREE.Vector3();_cv2=new THREE.Vector3()}
  egik.updateMatrixWorld();_cv1.set(0,0,0);egik.localToWorld(_cv1);_cv2.set(R+.1,0,0);egik.localToWorld(_cv2);_cv1.project(camera);_cv2.project(camera);
  const x=(_cv1.x+1)/2*innerWidth,y=(1-_cv1.y)/2*innerHeight,x2=(_cv2.x+1)/2*innerWidth,y2=(1-_cv2.y)/2*innerHeight;
  return {x,y,r:Math.hypot(x2-x,y2-y)};
}
const ekranAci=(x,y,m)=>Math.atan2(-(y-m.y),x-m.x);   // ekranda saat yönünün tersi pozitif (çarkla aynı)
const aciFark=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d};
function firlat(w){
  if(durum.asama!=='bos'||!cark)return;
  Ses.baslat();Ses.vuuu();
  const aw=Math.min(Math.abs(w),40),sure=Math.min(9000,2200+aw*190),bas=cark.rotation.z,son=bas+Math.sign(w)*aw*(sure/1000)/4;
  Object.assign(donus,{aktif:true,bas,son,t0:performance.now(),sure,hedef:ibreAltindaki(son),sonIndeks:ibreAltindaki(bas)});
  durum.asama='donuyor';el.alt.classList.add('gizli');
}
function surukleBitir(e,iptal){
  const S=Surukle;S.aktif=false;try{$('sahne').releasePointerCapture(S.id)}catch(x){}
  if(iptal)return;
  // hız: son ~180 ms'deki dönüş; parmak bırakmadan önce 220 ms'den uzun durduysa hız 0 sayılır
  const now=e&&e.timeStamp?e.timeStamp:performance.now(),son=S.ornek[S.ornek.length-1],o=S.ornek.filter(a=>son.t-a.t<=180);
  let w=0;if(o.length>=2&&now-son.t<220){const a=o[0];w=(son.z-a.z)/Math.max(.016,(son.t-a.t)/1000)}
  window.__sonHiz=w;
  if(S.toplam<.06){cevir();return}                       // kısa dokunuş: normal çevir
  if(Math.abs(w)>=SURUKLE_MIN_HIZ)firlat(w);
  else bilgi('Daha hızlı çevir! Parmağınla çarkı tut, hızlıca kaydır ve bırak.',2600);
}

$('sahne').addEventListener('pointermove',e=>{

  // yavaş cihazlarda tarayıcı hareketleri birleştirir; hepsini ayrı ayrı işleyince hız doğru ölçülür
  const olaylar=e.getCoalescedEvents&&e.getCoalescedEvents().length?e.getCoalescedEvents():[e],m=S.m;let now=0;
  for(const o of olaylar){
    if(Math.hypot(o.clientX-m.x,o.clientY-m.y)<m.r*.1)continue;   // göbeğin tam üstünde açı belirsiz
    const a=ekranAci(o.clientX,o.clientY,m),fark=aciFark(a,S.aci);S.aci=a;
    cark.rotation.z+=fark;S.toplam+=Math.abs(fark);now=o.timeStamp||performance.now();
    S.ornek.push({t:now,z:cark.rotation.z});
  }
  while(S.ornek.length>2&&now-S.ornek[0].t>250)S.ornek.shift();
  const ix=ibreAltindaki(cark.rotation.z);if(ix!==donus.sonIndeks){donus.sonIndeks=ix;Ses.tik();isaretSalla=.55}
});

$('sahne').addEventListener('pointerup',e=>{if(Surukle.aktif&&e.pointerId===Surukle.id){basla=null;surukleBitir(e,false);return}

const eslle=(v,a,b)=>Math.min(1,Math.max(0,(v-a)/b));   // kameranın orta bölgesini tüm ekrana yay

async function elModuAc(){

function beklemeSifirla(i){const b=El.bekle[i];if(b.h)b.h.classList.remove('el-hedef');b.h=null;El.imlec[i].querySelector('.dolum').style.strokeDashoffset='201'}

}

function kopekBoyutla(){
  const k=Kopek.kamera;if(!k)return;k.aspect=innerWidth/innerHeight;
  const t=Math.tan(THREE.MathUtils.degToRad(k.fov/2)),d=Math.max(2.25/t,2.75/(t*k.aspect))*1.24;
  k.position.set(.15,1.6+d*.2,d);k.lookAt(.15,1.2,0);k.updateProjectionMatrix();
}

// başın ekrandaki yeri ve yarıçapı (piksel)
function basEkran(){
  const K=Kopek;K.kafa.getWorldPosition(K.v);K.v2.copy(K.v);K.v2.y+=.62;K.v.project(K.kamera);K.v2.project(K.kamera);
  const x=(K.v.x+1)/2*innerWidth,y=(1-K.v.y)/2*innerHeight,x2=(K.v2.x+1)/2*innerWidth,y2=(1-K.v2.y)/2*innerHeight;
  return {x,y,r:Math.max(40,Math.hypot(x2-x,y2-y))};
}

// kay: imleç kaynağı (fare/dokunuş kimliği ya da 'el0'/'el1')
function kopekOksa(kay,x,y,now){
  const K=Kopek;if(!K.aktif)return;
  const s=K.son[kay];K.son[kay]={x,y,t:now};K.bakis={x,y,t:now};
  if(!s||now-s.t>450)return;
  const h=basEkran(),d=Math.hypot(x-h.x,y-h.y);if(d>h.r*1.4)return;
  const yol=Math.hypot(x-s.x,y-s.y);if(yol<h.r*.025)return;   // hareketsiz el okşama sayılmaz
  const once=K.m;K.sonOksama=now;K.m=Math.min(100,K.m+Math.min(yol,h.r*.5)/h.r*OKSAMA_HIZ);
  if(now-K.sonKalp>Math.max(150,320-K.m*1.7)){K.sonKalp=now;kalp(x+(Math.random()-.5)*36,y-h.r*.3,1)}
  if(now-K.sonBip>650){K.sonBip=now;Ses.mutluBip(K.m/100)}
  if(once<100&&K.m>=100&&!K.tamMutlu){
    K.tamMutlu=true;K.tamAn=now;K.zipla=now;Ses.seri();setTimeout(()=>Ses.hav(),380);setTimeout(()=>Ses.hav(),680);
    kutlamaYaz('ROBO ÇOK MUTLU! ♥');kalp(h.x,h.y-h.r*.4,46,true);setTimeout(()=>{const b=basEkran();kalp(b.x,b.y-b.r,30,true)},600);
  }
}
function kopekDokun(x,y){
  const K=Kopek,now=performance.now();K.bakis={x,y,t:now};K.hop=now;Ses.hav();
  const h=basEkran();if(Math.hypot(x-h.x,y-h.y)<h.r*1.3){K.m=Math.min(99.5,K.m+3);K.sonOksama=now;kalp(x,y-10,3)}
}

function kopekYuzCiz(f){
  const x=Kopek.yuzX,W=512,H=256,P=Math.PI;x.save();x.clearRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#161c4a');g.addColorStop(1,'#070a22');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(120,200,255,.05)';for(let y=0;y<H;y+=6)x.fillRect(0,y,W,2);
  const C=f==='kalp'?'#ff5f9e':'#6ff3ff',ex=[W*.33,W*.67],ey=H*.4;
  x.strokeStyle=C;x.fillStyle=C;x.shadowColor=C;x.shadowBlur=22;x.lineCap='round';x.lineJoin='round';
  if(f==='mutlu'){x.lineWidth=15;ex.forEach(cx=>{x.beginPath();x.moveTo(cx-34,ey+14);x.quadraticCurveTo(cx,ey-46,cx+34,ey+14);x.stroke()})}
  else if(f==='kirp'){x.lineWidth=13;ex.forEach(cx=>{x.beginPath();x.moveTo(cx-32,ey+4);x.lineTo(cx+32,ey+4);x.stroke()})}
  else if(f==='kalp'){ex.forEach(cx=>{kalpYol(x,cx,ey+6,46);x.fill()})}
  else{ex.forEach(cx=>{x.beginPath();x.ellipse(cx,ey,30,44,0,0,7);x.fill()});x.shadowBlur=0;x.fillStyle='#fff';ex.forEach(cx=>{x.beginPath();x.arc(cx+9,ey-15,10,0,7);x.fill()});
    if(f==='uzgun'){x.fillStyle='#10163f';ex.forEach((cx,i)=>{const s=i?-1:1;x.beginPath();x.moveTo(cx-55*s,ey-62);x.lineTo(cx+55*s,ey-62);x.lineTo(cx+55*s,ey-46);x.lineTo(cx-55*s,ey-4);x.closePath();x.fill()})}
    x.fillStyle=C;x.shadowBlur=22}
  // ağız
  x.lineWidth=9;x.beginPath();
  if(f==='uzgun'){x.arc(W/2,H*.9,24,1.2*P,1.8*P);x.stroke()}
  else if(f==='gulen'||f==='kalp'||f==='mutlu'){x.moveTo(W/2-48,H*.66);x.quadraticCurveTo(W/2,H*1.02,W/2+48,H*.66);x.closePath();x.fill();
    x.shadowBlur=0;x.fillStyle='#ff6f9a';x.beginPath();x.ellipse(W/2,H*.8,20,10,0,0,7);x.fill()}
  else{x.arc(W/2,H*.66,26,.15*P,.85*P);x.stroke()}
  // yanaklar
  if(f==='mutlu'||f==='kalp'||f==='gulen'){x.shadowColor='#ff5f9e';x.shadowBlur=18;x.fillStyle='rgba(255,95,158,.55)';[W*.15,W*.85].forEach(cx=>{x.beginPath();x.ellipse(cx,H*.66,34,15,0,0,7);x.fill()})}
  x.restore();Kopek.yuzTex.needsUpdate=true;
}

const KOPEK_SOZ=[[5,'Biraz yalnızım… başımı okşar mısın?'],[30,'Hmm, bu güzel!'],[60,'Çok hoşuma gidiyor!'],[90,'Kuyruğumu durduramıyorum!'],[101,'Neredeyse çok mutluyum!']];
function kopekGuncelle(now){
  const K=Kopek,dt=K.sonZaman?Math.min(.05,(now-K.sonZaman)/1000):0,t=now/1000;K.sonZaman=now;
  const oks=now-K.sonOksama<380;
  if(now-K.sonOksama>1800)K.m=Math.max(0,K.m-dt*MUTLULUK_AZALMA);
  if(K.tamMutlu&&K.m<70)K.tamMutlu=false;
  const k=K.m/100,L=(a,b,h)=>a+(b-a)*h,yum=Math.min(1,dt*8);
  // kuyruk: mutluluk arttıkça hızlı ve geniş sallanır
  K.faz+=dt*(3.5+k*20+(oks?6:0));K.kuyruk.rotation.x=Math.sin(K.faz)*(.15+k*.62);
  // baş: okşanırken ele sürtünür, değilse imlece bakar
  let hy=0,hz=0,hx=0;
  if(oks){hz=.2+Math.sin(t*5)*.06;hx=Math.sin(t*3.2)*.18;hy=Math.sin(t*2.1)*.1}
  else if(K.bakis&&now-K.bakis.t<2500){const h=basEkran(),nx=Math.max(-1,Math.min(1,(K.bakis.x-h.x)/(innerWidth*.4))),ny=Math.max(-1,Math.min(1,(h.y-K.bakis.y)/(innerHeight*.4)));hy=nx*.5;hz=ny*.32}
  else{hy=Math.sin(t*.7)*.18;hz=Math.sin(t*.9)*.06+(k<.05?-.15:0)}
  K.egim.y=L(K.egim.y,hy,yum);K.egim.z=L(K.egim.z,hz,yum);K.egim.x=L(K.egim.x,hx,yum);
  K.bas.rotation.set(K.egim.x+Math.sin(t*1.3)*.03,KOPEK_BAS+K.egim.y,K.egim.z);
  // kulaklar: okşanınca geriye yatar, mutluyken kıpır kıpır
  K.kulakGeri=L(K.kulakGeri,oks?1:0,yum);
  K.kulaklar.forEach((p,i)=>{const s=i?1:-1;p.rotation.x=s*(.28+K.kulakGeri*.35)+Math.sin(t*(3+k*9)+i*2)*.07*(.3+k);p.rotation.z=K.kulakGeri*.75});
  // gövde: nefes, mutluyken zıplayarak dans, dokununca hop, %100'de taklalı zıplama
  let y=Math.sin(t*2.2)*.02,don=0;
  if(k>.6)y+=Math.abs(Math.sin(t*5.5))*.12*(k-.6)/.4;
  const ph=(now-K.hop)/1000;if(ph<.4)y+=Math.sin(ph/.4*Math.PI)*.3;
  const pz=(now-K.zipla)/1000;if(pz<1.2){const e=pz/1.2;y+=Math.sin(e*Math.PI)*1.4;don=(1-Math.pow(1-e,3))*Math.PI*2}
  K.kok.position.y=y;K.kok.rotation.y=KOPEK_YON+don;
  K.golge.scale.set(1.9*(1-Math.min(.4,y*.25)),1.1*(1-Math.min(.4,y*.25)),1);
  K.bacaklar.forEach((b,i)=>{b.rotation.z=k>.6?Math.sin(t*11+(i%2?Math.PI:0)+(i>1?Math.PI/2:0))*.22*(k-.6)/.4:0});
  K.dil.visible=k>.4&&!oks;K.dil.scale.y=.35+Math.sin(t*9)*.06;
  K.kunye.rotation.z=.1+Math.sin(t*(2+k*8))*.25;
  // ışıklar: maviden pembeye
  K.parla.emissive.setRGB(L(.18,1,k),L(.82,.31,k),L(1,.55,k));K.parla.emissiveIntensity=1+Math.sin(t*(2+k*8))*.35;
  K.halka.material.color.copy(K.parla.emissive);K.halka.scale.setScalar(1+Math.sin(t*2)*.03+k*.08);K.halka.material.opacity=.35+k*.45;
  K.uzaktaKalpler.forEach(s=>{s.position.y+=s.userData.vy*(1+k*2);s.position.x+=Math.sin(t+s.userData.faz)*.004;if(s.position.y>8)s.position.y=-1.5});
  // ifade
  if(now-K.kirpBas>K.kirpAra){K.kirpBas=now;K.kirpAra=2200+Math.random()*3200}
  const kirp=now-K.kirpBas<150;
  const ifade=(K.tamMutlu&&now-K.tamAn<4500)||K.m>=99?'kalp':oks?'mutlu':kirp?'kirp':k>.5?'gulen':(K.m<5&&now-K.sonOksama>6000)?'uzgun':'normal';
  if(ifade!==K.ifade){K.ifade=ifade;kopekYuzCiz(ifade)}
  // kendiliğinden çıkan kalpler
  if(k>.4&&!oks&&now-K.sonOtoKalp>1300-k*700){K.sonOtoKalp=now;const h=basEkran();kalp(h.x+(Math.random()-.5)*h.r*1.6,h.y-h.r*.9,1)}
  // arayüz
  $('mBar').style.width=K.m.toFixed(1)+'%';$('mYuzde').textContent=Math.round(K.m)+'%';$('mutluluk').classList.toggle('atiyor',oks||K.m>=99);
  const metin=K.m>=99||(K.tamMutlu&&now-K.tamAn<4500)?'ÇOK MUTLUYUM! Seni seviyorum! ♥':oks?'Hav! Daha, daha!':KOPEK_SOZ.find(([s])=>K.m<s)[1];
  if(metin!==K.metin){K.metin=metin;const d=$('kopekDurum');d.textContent=metin;d.classList.remove('zipla');void d.offsetWidth;d.classList.add('zipla')}
  $('kopekDurum').style.setProperty('--kopek','#'+K.parla.emissive.getHexString());
}

function kopekAc(){
  if(!renderer||durum.asama!=='bos')return;
  if(!Kopek.sahne)kopekKur();
  Ses.baslat();Kopek.aktif=true;durum.asama='kopek';Kopek.sonZaman=0;Kopek.son={};Kopek.ifade='';
  el.alt.classList.add('gizli');$('kopekUI').hidden=false;$('kopekBtn').setAttribute('aria-pressed','true');
  kopekBoyutla();Ses.hav();Kopek.hop=performance.now();
  bilgi(El.acik?'Elini Robo\'nun başının üstünde ileri geri gezdir!':'Robo\'nun başını fareyle ya da parmağınla okşa. Kamerayla sevmek için "El ile oyna"ya bas.',5000);
}
function kopekKapat(){
  if(!Kopek.aktif)return;Kopek.aktif=false;durum.asama='bos';
  el.alt.classList.remove('gizli');$('kopekUI').hidden=true;$('kopekBtn').setAttribute('aria-pressed','false');Ses.tikla();
}
$('kopekBtn').addEventListener('click',()=>{if(Kopek.aktif)kopekKapat();else if(durum.asama==='bos')kopekAc();else bilgi('Önce bu turu bitir, sonra Robo ile oynayabilirsin!',2500)});
$('kopekCik').addEventListener('click',kopekKapat);

// ================= BAŞLAT =================
seviyeYaz();$('sesBtn').setAttribute('aria-pressed',String(Ses.acik));$('sureBtn').setAttribute('aria-pressed',String(durum.sureAcik));
function hata(m){const u=$('uyari');u.innerHTML=m;u.hidden=false}
const fontHazir=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('800 60px "Baloo 2"'),document.fonts.load('800 20px "Nunito"')]),new Promise(r=>setTimeout(r,1800))]):Promise.resolve();
fontHazir.catch(()=>{}).then(()=>{
  if(!window.THREE){hata('3B kütüphanesi yüklenemedi.<br>“lib/three.min.js” dosyasının index.html ile aynı klasörde olduğundan emin olun.');return}
  try{sahneKur()}catch(e){hata('Bu cihaz 3B grafikleri (WebGL) desteklemiyor.<br>Lütfen güncel bir Chrome, Edge veya Safari ile açın.');console.error(e);return}
  requestAnimationFrame(dongu);
});
